<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="weather-app">
      <h1>Weather App</h1>
      <form id="weather-form" class="weather-form">
        <label for="city-input">City</label>
        <input id="city-input" name="city" type="text" placeholder="e.g. London" required />
        <button type="submit">Get Weather</button>
      </form>

      <p id="status" class="status" aria-live="polite"></p>

      <section id="weather-result" class="weather-result" hidden>
        <h2 id="location-name"></h2>
        <p><strong>Temperature:</strong> <span id="temperature"></span>°C</p>
        <p><strong>Wind:</strong> <span id="wind-speed"></span> km/h</p>
        <p><strong>Condition:</strong> <span id="condition"></span></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
